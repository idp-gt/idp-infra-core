kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp-local-core
nodes:
  # ------------------------------------------------------------------------------------------------
  # Control Plane (API Server + Local Ingress Port Forwarding)
  # ------------------------------------------------------------------------------------------------
  - role: control-plane
    image: kindest/node:v1.30.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP # ArgoCD / Console UI direct access

  # ------------------------------------------------------------------------------------------------
  # Node 1: Simulating Hub & Core Platform Services (ArgoCD, Crossplane, Ingress)
  # ------------------------------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.2
    labels:
      node.idp.io/profile: base
      idp.topology/role: hub
      environment: local-dev

  # ------------------------------------------------------------------------------------------------
  # Node 2: Simulating Spoke - Data Services (Kafka, Postgres, Redis)
  # ------------------------------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.2
    labels:
      node.idp.io/profile: data
      idp.topology/role: spoke-data
      environment: local-dev

  # ------------------------------------------------------------------------------------------------
  # Node 3: Simulating Spoke - AI/ML Services (Ollama, Vector DB, Local AI Model Server)
  # ------------------------------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.2
    labels:
      node.idp.io/profile: ai
      idp.topology/role: spoke-ai
      environment: local-dev

