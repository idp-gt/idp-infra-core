apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-hello
  namespace: demo
  labels:
    app: demo-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-hello
  template:
    metadata:
      labels:
        app: demo-hello
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-hello-service
  namespace: demo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: demo-hello
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-hello-ingress
  namespace: demo
  annotations:
    ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: demo-hello-service
                port:
                  number: 80

