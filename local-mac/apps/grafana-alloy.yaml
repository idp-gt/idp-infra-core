apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 0.9.1
    helm:
      values: |
        alloy:
          resources:
            limits:
              cpu: 300m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
          # Inyección de variables de entorno desde el Secret de Kubernetes
          extraEnv:
            - name: GRAFANA_CLOUD_PROMETHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: prometheus-url
                  optional: true
            - name: GRAFANA_CLOUD_PROMETHEUS_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: prometheus-user
                  optional: true
            - name: GRAFANA_CLOUD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: api-token
                  optional: true
          # Configuración de Alloy especializada en Prometheus Metrics para Grafana Cloud
          configMap:
            create: true
            content: |
              // -----------------------------------------------------------------------
              // 1. Descubrimiento de Pods de Kubernetes con anotaciones de Prometheus
              // -----------------------------------------------------------------------
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "prometheus_pods" {
                targets = discovery.kubernetes.pods.targets

                // Scrapear pods anotados con prometheus.io/scrape: "true" o servicios IDP
                rule {
                  action        = "keep"
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
                  regex         = "true"
                }
                rule {
                  action        = "replace"
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
                  target_label  = "__metrics_path__"
                  regex         = "(.+)"
                }
                rule {
                  action        = "replace"
                  source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
                  target_label  = "__address__"
                  regex         = "([^:]+)(?::\\d+)?;(\\d+)"
                  replacement   = "$1:$2"
                }
                rule {
                  action        = "replace"
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  action        = "replace"
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  action        = "replace"
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              prometheus.scrape "cluster_pods" {
                targets         = discovery.relabel.prometheus_pods.output
                scrape_interval = "30s"
                forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // -----------------------------------------------------------------------
              // 2. Scrape interno del propio Grafana Alloy
              // -----------------------------------------------------------------------
              prometheus.exporter.self "alloy" {
              }

              prometheus.scrape "alloy" {
                targets         = prometheus.exporter.self.alloy.targets
                scrape_interval = "30s"
                forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // -----------------------------------------------------------------------
              // 3. Scrape de Métricas de ArgoCD (Controller, Server, Repo, AppSet)
              // -----------------------------------------------------------------------
              prometheus.scrape "argocd" {
                targets = [
                  {
                    "__address__" = "argocd-metrics.argocd.svc.cluster.local:8082",
                    "job"         = "argocd-application-controller",
                    "namespace"   = "argocd",
                    "cluster"     = "idp-local-core",
                  },
                  {
                    "__address__" = "argocd-server-metrics.argocd.svc.cluster.local:8083",
                    "job"         = "argocd-server",
                    "namespace"   = "argocd",
                    "cluster"     = "idp-local-core",
                  },
                  {
                    "__address__" = "argocd-repo-server.argocd.svc.cluster.local:8084",
                    "job"         = "argocd-repo-server",
                    "namespace"   = "argocd",
                    "cluster"     = "idp-local-core",
                  },
                  {
                    "__address__" = "argocd-applicationset-controller.argocd.svc.cluster.local:8080",
                    "job"         = "argocd-applicationset-controller",
                    "namespace"   = "argocd",
                    "cluster"     = "idp-local-core",
                  },
                  {
                    "__address__" = "argocd-notifications-controller-metrics.argocd.svc.cluster.local:9001",
                    "job"         = "argocd-notifications-controller",
                    "namespace"   = "argocd",
                    "cluster"     = "idp-local-core",
                  },
                ]
                scrape_interval = "15s"
                forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // -----------------------------------------------------------------------
              // 4. Destino: Prometheus Remote Write hacia Grafana Cloud (Mimir)
              // -----------------------------------------------------------------------
              prometheus.remote_write "grafana_cloud" {
                endpoint {
                  url = coalesce(sys.env("GRAFANA_CLOUD_PROMETHEUS_URL"), "https://prometheus-us-central1.grafana.net/api/prom/push")

                  basic_auth {
                    username = coalesce(sys.env("GRAFANA_CLOUD_PROMETHEUS_USER"), "000000")
                    password = coalesce(sys.env("GRAFANA_CLOUD_API_TOKEN"), "placeholder_token")
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
