apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-local-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/idp-gt/idp-infra-core.git
    targetRevision: HEAD
    path: local-mac/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

