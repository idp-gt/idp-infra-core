apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.local.yaml: |
    app:
      title: "IDP Developer Portal"
      baseUrl: "http://localhost:7007"

    auth:
      environment: development

    backend:
      baseUrl: "http://localhost:7007"
      listen:
        port: 7007
      cors:
        origin: "http://localhost:7007"
      auth:
        keys:
          - secret: "local-idp-secret-key-for-service-tokens-2026"

    integrations:
      github:
        - host: github.com
      gitlab:
        - host: gitlab.com

    argocd:
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: 'local-argocd'
              url: 'http://argocd-server.argocd.svc.cluster.local'
              token: 'placeholder-token'

    proxy:
      endpoints:
        '/jfrog-artifactory/api': 'https://example.com'
        '/dynatrace': 'https://example.com'
        '/nexus-repository-manager': 'https://example.com'
        '/jira/api': 'https://example.com'
        '/acr/api': 'https://example.com'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
    app.kubernetes.io/name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: quay.io/janus-idp/backstage-showcase:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.local.yaml"
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: NODE_ENV
              value: "development"
            - name: BACKEND_SECRET
              value: "local-idp-secret-key-for-service-tokens-2026"
            - name: APP_CONFIG_app_baseUrl
              value: "http://localhost:7007"
            - name: APP_CONFIG_backend_baseUrl
              value: "http://localhost:7007"
            - name: APP_CONFIG_backend_listen_port
              value: "7007"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config-volume
              mountPath: /opt/app-root/src/app-config.local.yaml
              subPath: app-config.local.yaml
      volumes:
        - name: config-volume
          configMap:
            name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7007
      targetPort: 7007
  selector:
    app: backstage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-ingress
  namespace: backstage
  annotations:
    ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
