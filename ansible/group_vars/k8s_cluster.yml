---
# Kubespray Configuration for IDP Simulated On-Prem Bare-Metal Kubernetes

# Kubernetes version
kube_version: v1.30.2

# CNI Network plugin (Calico or Cilium)
kube_network_plugin: calico
calico_version: "v3.28.0"
calico_ipip_mode: 'Always'

# Internal Kubernetes Service & Pod Subnets (must not overlap with VPC/cloud CIDRs)
kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18
kube_network_node_prefix: 24

# DNS Configuration
kube_dns_mode: coredns
enable_nodelocaldns: true

# Control Plane & Etcd
etcd_deployment_type: host
kube_proxy_mode: ipvs

# Platform Engineering Addons for Bare-Metal
helm_enabled: true
ingress_nginx_enabled: true
ingress_nginx_host_network: true
metrics_server_enabled: true
local_path_provisioner_enabled: true
cert_manager_enabled: false # Managed via GitOps later

# Kubeconfig export
kubeconfig_localhost: true

