# Kubespray Inventory for Local macOS VMs (Multipass / Lima)
# Useful for completely offline / local bare-metal simulation on Mac

[all]
local-cp-1     ansible_host=192.168.64.10 ip=192.168.64.10 etcd_member_name=etcd1 ansible_user=ubuntu
local-worker-1 ansible_host=192.168.64.11 ip=192.168.64.11 ansible_user=ubuntu

[kube_control_plane]
local-cp-1

[etcd]
local-cp-1

[kube_node]
local-worker-1

[calico_rr]

[k8s_cluster:children]
kube_control_plane
kube_node
calico_rr

